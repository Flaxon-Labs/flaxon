<!-- templates/admin/base.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}{{ title }}{% endblock %} - Flaxon Admin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>

    <!-- Three.js for 3D UI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Admin CSS -->
    <link rel="stylesheet" href="/static/admin/css/admin.css">

    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- 3D Background Container -->
    <div id="three-container" class="fixed inset-0 -z-10"></div>

    <!-- Admin Layout -->
    <div class="min-h-screen bg-slate-900/90 backdrop-blur-sm text-slate-100" x-data="adminApp()" x-init="init()">
        <!-- Top Navigation -->
        <nav class="bg-slate-800/80 backdrop-blur-sm border-b border-slate-700/50 sticky top-0 z-50">
            <div class="px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <!-- Logo -->
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center text-white font-bold text-sm">
                            F
                        </div>
                        <span class="text-lg font-bold text-white hidden sm:block">{{ config.site_title }}</span>
                    </div>

                    <!-- Search -->
                    <div class="flex-1 max-w-md mx-4 hidden md:block">
                        <div class="relative">
                            <input type="text" placeholder="Search..." class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2 pl-10 text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition">
                            <i class="fas fa-search absolute left-3 top-2.5 text-slate-400"></i>
                        </div>
                    </div>

                    <!-- Right Actions -->
                    <div class="flex items-center gap-2 sm:gap-3">
                        <button class="p-2 rounded-lg hover:bg-slate-700/50 transition text-slate-400 hover:text-white relative">
                            <i class="fas fa-bell"></i>
                            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                        <button @click="toggleDarkMode()" class="p-2 rounded-lg hover:bg-slate-700/50 transition text-slate-400 hover:text-white">
                            <i class="fas" :class="darkMode ? 'fa-sun' : 'fa-moon'"></i>
                        </button>
                        <button class="p-2 rounded-lg hover:bg-slate-700/50 transition text-slate-400 hover:text-white">
                            <i class="fas fa-user-circle text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Mobile Bottom Nav -->
        <div class="fixed bottom-0 left-0 right-0 bg-slate-800/90 backdrop-blur-sm border-t border-slate-700/50 z-40 md:hidden flex justify-around items-center h-16 px-2">
            <button onclick="window.location.href='{{ url_prefix }}/'" class="flex flex-col items-center text-slate-400 hover:text-white transition py-1 px-3 rounded-lg hover:bg-slate-700/50">
                <i class="fas fa-th-large text-lg"></i>
                <span class="text-[10px] mt-0.5">Dashboard</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-white transition py-1 px-3 rounded-lg hover:bg-slate-700/50">
                <i class="fas fa-search text-lg"></i>
                <span class="text-[10px] mt-0.5">Search</span>
            </button>
            <button class="flex flex-col items-center text-blue-400 hover:text-white transition py-1 px-3 rounded-lg bg-blue-500/10">
                <i class="fas fa-plus-circle text-xl"></i>
                <span class="text-[10px] mt-0.5">Add</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-white transition py-1 px-3 rounded-lg hover:bg-slate-700/50">
                <i class="fas fa-bell text-lg"></i>
                <span class="text-[10px] mt-0.5">Alerts</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-white transition py-1 px-3 rounded-lg hover:bg-slate-700/50">
                <i class="fas fa-user text-lg"></i>
                <span class="text-[10px] mt-0.5">Profile</span>
            </button>
        </div>

        <!-- Main Content -->
        <div class="flex">
            <!-- Sidebar (desktop) -->
            <aside class="hidden md:block w-64 bg-slate-800/40 backdrop-blur-sm border-r border-slate-700/50 min-h-[calc(100vh-4rem)] overflow-y-auto">
                <div class="p-4">
                    <p class="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-3">Navigation</p>
                    <div class="space-y-1">
                        <a href="{{ url_prefix }}/" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 transition">
                            <i class="fas fa-th-large w-5"></i>
                            <span>Dashboard</span>
                        </a>
                        {% for model in models %}
                        <a href="{{ url_prefix }}/{{ model.get_name() }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/30 transition">
                            <i class="fas fa-table w-5"></i>
                            <span>{{ model.get_verbose_name_plural() }}</span>
                        </a>
                        {% endfor %}
                    </div>
                </div>
            </aside>

            <!-- Page Content -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8 pb-20 md:pb-8">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Admin JS -->
    <script src="/static/admin/js/admin.js"></script>
    {% block extra_scripts %}{% endblock %}

    <script>
        function adminApp() {
            return {
                darkMode: localStorage.getItem('admin-dark-mode') === 'true' || true,
                init() {
                    // Initialize 3D background
                    initThreeJS();
                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },
                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('admin-dark-mode', this.darkMode);
                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                }
            }
        }

        function initThreeJS() {
            const container = document.getElementById('three-container');
            if (!container) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Particles
            const geometry = new THREE.BufferGeometry();
            const count = 2000;
            const positions = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 200;
                if (i % 3 === 1) sizes[i/3] = Math.random() * 2 + 0.5;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                color: 0x3b82f6,
                size: 0.15,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Floating shapes
            const shapes = [];
            const colors = [0x3b82f6, 0x06b6d4, 0x8b5cf6, 0xec4899];

            for (let i = 0; i < 8; i++) {
                const size = Math.random() * 0.5 + 0.2;
                const geo = new THREE.IcosahedronGeometry(size, 0);
                const mat = new THREE.MeshBasicMaterial({
                    color: colors[i % colors.length],
                    wireframe: true,
                    transparent: true,
                    opacity: 0.2 + Math.random() * 0.3,
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 60,
                    (Math.random() - 0.5) * 40,
                    (Math.random() - 0.5) * 30 - 20
                );
                mesh.userData = {
                    rotX: (Math.random() - 0.5) * 0.01,
                    rotY: (Math.random() - 0.5) * 0.01,
                    rotZ: (Math.random() - 0.5) * 0.01,
                    floatSpeed: 0.002 + Math.random() * 0.003,
                    floatAmp: 0.3 + Math.random() * 0.5,
                    origY: mesh.position.y,
                };
                scene.add(mesh);
                shapes.push(mesh);
            }

            camera.position.z = 30;

            let time = 0;

            function animate() {
                requestAnimationFrame(animate);
                time += 0.01;

                particles.rotation.x = Math.sin(time * 0.02) * 0.02;
                particles.rotation.y = time * 0.01;

                shapes.forEach((mesh) => {
                    mesh.rotation.x += mesh.userData.rotX;
                    mesh.rotation.y += mesh.userData.rotY;
                    mesh.rotation.z += mesh.userData.rotZ;
                    mesh.position.y = mesh.userData.origY + Math.sin(time * mesh.userData.floatSpeed) * mesh.userData.floatAmp;
                });

                renderer.render(scene, camera);
            }

            animate();

            // Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
