<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} - Password reset</title><link rel="stylesheet" href="/static/admin/css/admin.css"></head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center"><main class="w-full max-w-sm bg-slate-800 border border-slate-700 rounded-lg p-6 space-y-5"><h1 class="text-xl font-semibold">Password recovery</h1>{% if message %}<p class="text-emerald-400 text-sm">{{ message }}</p>{% endif %}{% if error %}<p class="text-red-400 text-sm">{{ error }}</p>{% endif %}<form method="post" class="space-y-3"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label class="block text-sm">Username or email<input name="identifier" required class="mt-1 w-full bg-slate-700 border border-slate-600 rounded px-3 py-2"></label><button class="w-full bg-blue-600 rounded px-3 py-2">Send reset instructions</button></form><form method="post" class="space-y-3 border-t border-slate-700 pt-4"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label class="block text-sm">Reset token<input name="token" class="mt-1 w-full bg-slate-700 border border-slate-600 rounded px-3 py-2"></label><label class="block text-sm">New password<input name="password" type="password" required class="mt-1 w-full bg-slate-700 border border-slate-600 rounded px-3 py-2"></label><button class="w-full bg-slate-700 rounded px-3 py-2">Reset password</button></form><a href="{{ login_url }}" class="block text-center text-sm text-slate-400">Back to login</a></main></body></html>
