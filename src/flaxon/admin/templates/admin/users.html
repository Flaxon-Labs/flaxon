{% extends "admin/base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="space-y-6">
  <div><h1 class="text-2xl font-bold">Users</h1><p class="text-slate-400">Manage accounts, roles, permissions, and access.</p></div>
  {% if error %}<p class="text-red-400">{{ error }}</p>{% endif %}
  <form method="post" class="grid grid-cols-1 md:grid-cols-5 gap-3 bg-slate-800/50 border border-slate-700 rounded-lg p-4">
    <input type="hidden" name="_csrf" value="{{ dashboard.csrf_token() }}"><input name="username" required placeholder="Username" class="bg-slate-700 border border-slate-600 rounded px-3 py-2"><input name="email" type="email" placeholder="Email" class="bg-slate-700 border border-slate-600 rounded px-3 py-2"><input name="password" type="password" required placeholder="Password" class="bg-slate-700 border border-slate-600 rounded px-3 py-2"><input name="roles" placeholder="Roles, comma separated" value="staff" class="bg-slate-700 border border-slate-600 rounded px-3 py-2"><button class="bg-blue-600 rounded px-3 py-2">Create user</button>
  </form>
  <div class="space-y-3">{% for item in users %}<article class="bg-slate-800/50 border border-slate-700 rounded-lg p-4" data-user="{{ item.username }}"><div class="grid grid-cols-1 md:grid-cols-5 gap-3 items-center"><strong>{{ item.username }}</strong><input data-field="email" value="{{ item.email or '' }}" type="email" class="bg-slate-700 border border-slate-600 rounded px-2 py-1"><input data-field="roles" value="{{ item.roles|join(', ') }}" class="bg-slate-700 border border-slate-600 rounded px-2 py-1"><input data-field="permissions" value="{{ item.permissions|join(', ') }}" class="bg-slate-700 border border-slate-600 rounded px-2 py-1"><label class="text-sm"><input data-field="active" type="checkbox" {% if item.active is not defined or item.active %}checked{% endif %}> Active</label></div><div class="mt-3 flex gap-2"><input data-field="password" type="password" placeholder="New password" class="bg-slate-700 border border-slate-600 rounded px-2 py-1"><button type="button" data-action="save" class="bg-indigo-600 rounded px-3 py-1 text-sm">Save</button><button type="button" data-action="delete" class="bg-red-700 rounded px-3 py-1 text-sm">Delete</button></div></article>{% endfor %}</div>
</div>
<script>
const userCsrf = '{{ dashboard.csrf_token() }}';
document.querySelectorAll('[data-user]').forEach(card => {
  const username = encodeURIComponent(card.dataset.user);
  card.querySelector('[data-action="save"]').onclick = async () => {
    const value = field => card.querySelector(`[data-field="${field}"]`);
    const roles = value('roles').value.split(',').map(v => v.trim()).filter(Boolean);
    const permissions = value('permissions').value.split(',').map(v => v.trim()).filter(Boolean);
    const body = {email:value('email').value, roles, permissions, active:value('active').checked};
    if (value('password').value) body.password = value('password').value;
    const response = await fetch('{{ dashboard.url_prefix }}/users/' + username, {method:'PATCH', headers:{'Content-Type':'application/json','X-CSRF-Token':userCsrf}, body:JSON.stringify(body)});
    if (response.ok) location.reload();
  };
  card.querySelector('[data-action="delete"]').onclick = async () => { if (!confirm('Delete this user?')) return; const response = await fetch('{{ dashboard.url_prefix }}/users/' + username, {method:'DELETE', headers:{'X-CSRF-Token':userCsrf}}); if (response.ok) card.remove(); };
});
</script>
{% endblock %}
