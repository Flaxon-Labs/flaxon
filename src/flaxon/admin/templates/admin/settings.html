{% extends "admin/base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}<div class="space-y-6"><h1 class="text-2xl font-bold">Settings</h1><form method="post" class="max-w-xl bg-slate-800/50 border border-slate-700 rounded-lg p-6 space-y-4"><input type="hidden" name="_csrf" value="{{ dashboard.csrf_token() }}"><label class="block text-sm">Site title<input name="site_title" value="{{ config.site_title }}" class="mt-1 w-full bg-slate-700 border border-slate-600 rounded px-3 py-2"></label><label class="block text-sm">Site header<input name="site_header" value="{{ config.site_header }}" class="mt-1 w-full bg-slate-700 border border-slate-600 rounded px-3 py-2"></label><label class="block text-sm">Timezone<input name="timezone" value="{{ config.timezone }}" class="mt-1 w-full bg-slate-700 border border-slate-600 rounded px-3 py-2"></label><button class="bg-blue-600 rounded px-4 py-2">Save settings</button></form></div>{% endblock %}
