<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GraphiQL - GraphQL Playground</title>
    <link rel="stylesheet" href="https://unpkg.com/graphiql@3.0.6/graphiql.min.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #graphiql {
            height: 100vh;
        }
        .graphiql-container {
            background: #1a1a2e;
        }
    </style>
</head>
<body>
    <div id="graphiql">Loading GraphiQL...</div>
    <script
        crossorigin
        src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
        crossorigin
        src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script
        crossorigin
        src="https://unpkg.com/graphiql@3.0.6/graphiql.min.js"
    ></script>
    <script>
        const graphQLFetcher = async (graphQLParams) => {
            const response = await fetch('/graphql', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(graphQLParams),
            });
            return response.json();
        };

        ReactDOM.createRoot(document.getElementById('graphiql')).render(
            React.createElement(GraphiQL, {
                fetcher: graphQLFetcher,
                defaultQuery: `# Welcome to Flaxon GraphQL
#
# Type queries into this side of the screen, and you will
# see intelligent typeaheads aware of the current GraphQL type schema,
# and live syntax and validation errors highlighted within the text.

# Example query:
query {
  __schema {
    types {
      name
      description
    }
  }
}

# Example mutation:
# mutation {
#   createUser(name: "Alice", email: "alice@example.com") {
#     id
#     name
#     email
#   }
# }`,
            })
        );
    </script>
</body>
</html>
