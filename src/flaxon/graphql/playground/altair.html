<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Altair - GraphQL Playground</title>
    <base href="https://unpkg.com/altair-static@5.2.1/build/dist/" />
    <link href="https://unpkg.com/altair-static@5.2.1/build/dist/styles.css" rel="stylesheet" />
</head>
<body>
    <app-root></app-root>
    <script src="https://unpkg.com/altair-static@5.2.1/build/dist/runtime.js"></script>
    <script src="https://unpkg.com/altair-static@5.2.1/build/dist/polyfills.js"></script>
    <script src="https://unpkg.com/altair-static@5.2.1/build/dist/main.js"></script>
    <script>
        window.addEventListener('load', function () {
            if (window.AltairGraphQL) {
                window.AltairGraphQL.init({
                    endpointURL: '/graphql',
                    initialQuery: '# Flaxon GraphQL API\nquery { __typename }',
                    initialHeaders: { 'Content-Type': 'application/json' },
                    initialVariables: {},
                    disableAccount: true
                });
            }
        });
    </script>
</body>
</html>
