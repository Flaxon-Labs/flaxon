<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Altair - GraphQL Playground</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #altair-container {
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="altair-container"></div>
    <script
        src="https://unpkg.com/altair-static@5.2.1/build/dist/altair.min.js"
    ></script>
    <script>
        const altair = Altair({
            endpointURL: '/graphql',
            initialQuery: `# Welcome to Altair - GraphQL Playground
#
# Explore your Flaxon GraphQL API with this interactive tool.
# Auto-completion and type checking available!

query {
  __schema {
    types {
      name
      description
      fields {
        name
        type {
          name
        }
      }
    }
  }
}

# Try a mutation:
# mutation {
#   createUser(name: "John Doe", email: "john@example.com") {
#     id
#     name
#     email
#   }
# }`,
            initialHeaders: {
                'Content-Type': 'application/json',
            },
            initialVariables: {},
            theme: 'dark',
        });

        document.getElementById('altair-container').appendChild(altair);
    </script>
</body>
</html>
