[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxon-framework"
version = "0.1.0"
description = "A small, async-first Python backend framework prototype with optional Jinax templates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aldane Hutchinson"}]
keywords = ["asgi", "web", "framework", "api", "websocket", "jinja2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = []

[project.optional-dependencies]
standard = ["uvicorn>=0.30", "jinja2>=3.1"]
templates = ["jinja2>=3.1"]
server = ["uvicorn>=0.30"]
dev = ["pytest>=8", "pytest-cov>=5", "jinja2>=3.1", "uvicorn>=0.30"]

[project.scripts]
flaxon = "flaxon.cli.main:main"

[project.urls]
Homepage = "https://example.com/flaxon"
Documentation = "https://example.com/flaxon/docs"
Repository = "https://github.com/example/flaxon"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
