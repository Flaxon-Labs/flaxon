<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flaxon Page Builder</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    [x-cloak] { display: none !important; }

    .palette-item { cursor: grab; }
    .palette-item:active { cursor: grabbing; }

    .canvas-block { position: relative; transition: transform 0.15s ease; }
    .canvas-block.dragging { opacity: 0.4; }
    .canvas-block.drag-over-top::before,
    .canvas-block.drag-over-bottom::after {
      content: "";
      position: absolute; left: 0; right: 0; height: 3px;
      background: #6366f1; border-radius: 2px;
    }
    .canvas-block.drag-over-top::before { top: -2px; }
    .canvas-block.drag-over-bottom::after { bottom: -2px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen overflow-hidden">

  <div x-data="pageBuilder()" x-init="init()" x-cloak class="h-screen flex flex-col">

    <!-- Top bar -->
    <header class="h-14 bg-slate-800/80 border-b border-slate-700/50 flex items-center justify-between px-4 flex-shrink-0">
      <div class="flex items-center gap-3">
        <span class="font-semibold">Page Builder</span>
        <select x-model="currentSlug" @change="loadPage(currentSlug)" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
          <template x-for="p in pages" :key="p.slug">
            <option :value="p.slug" x-text="p.title + ' (' + p.slug + ')'"></option>
          </template>
        </select>
        <button @click="newPage()" class="text-xs px-2 py-1 rounded bg-slate-700 hover:bg-slate-600">+ New</button>
      </div>
      <div class="flex items-center gap-3">
        <span x-show="saveStatus" x-text="saveStatus" class="text-xs text-slate-400"></span>
        <a :href="'/builder/p/' + currentSlug" target="_blank" class="text-xs px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600">Preview &#8599;</a>
        <button @click="save()" class="text-xs px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 font-medium">Save</button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden">

      <!-- Palette -->
      <aside class="w-56 bg-slate-800/50 border-r border-slate-700/50 p-3 overflow-y-auto flex-shrink-0">
        <div class="text-xs uppercase tracking-wide text-slate-500 mb-2 px-1">Blocks</div>
        <template x-for="bt in blockTypes" :key="bt.type">
          <div
            class="palette-item flex items-center gap-2 px-3 py-2 mb-1.5 rounded-lg bg-slate-800 border border-slate-700/50 hover:border-indigo-500/50 text-sm"
            draggable="true"
            @dragstart="onPaletteDragStart($event, bt)"
          >
            <span class="w-6 h-6 flex items-center justify-center rounded bg-indigo-500/15 text-indigo-300 text-[10px] font-bold" x-text="bt.icon"></span>
            <span x-text="bt.label"></span>
          </div>
        </template>
      </aside>

      <!-- Canvas -->
      <main class="flex-1 overflow-y-auto p-8">
        <div
          class="max-w-2xl mx-auto bg-white text-slate-900 rounded-xl shadow-2xl min-h-[400px] p-8"
          @dragover.prevent="onCanvasDragOver($event)"
          @dragleave="onCanvasDragLeave($event)"
          @drop.prevent="onCanvasDrop($event)"
        >
          <template x-if="blocks.length === 0">
            <div class="text-center text-slate-400 py-20 border-2 border-dashed border-slate-200 rounded-lg">
              Drag a block here to get started
            </div>
          </template>

          <template x-for="(block, index) in blocks" :key="block.id">
            <div
              class="canvas-block group px-2 py-1 rounded"
              :class="{
                'dragging': draggingId === block.id,
                'drag-over-top': dragOverId === block.id && dragOverPos === 'top',
                'drag-over-bottom': dragOverId === block.id && dragOverPos === 'bottom',
                'ring-2 ring-indigo-500': selectedId === block.id,
              }"
              draggable="true"
              @dragstart="onBlockDragStart($event, block)"
              @dragend="onBlockDragEnd()"
              @dragover.prevent="onBlockDragOver($event, block)"
              @drop.prevent="onBlockDrop($event, block)"
              @click="selectedId = block.id"
            >
              <div class="absolute -left-7 top-1 opacity-0 group-hover:opacity-100 text-slate-300 text-xs select-none">&#8942;&#8942;</div>
              <div class="absolute -right-2 -top-2 opacity-0 group-hover:opacity-100">
                <button @click.stop="deleteBlock(block.id)" class="w-5 h-5 rounded-full bg-red-500 text-white text-xs leading-none">&times;</button>
              </div>

              <template x-if="block.type === 'heading'">
                <h1 x-show="block.props.level === '1'" x-text="block.props.text" class="text-3xl font-bold"></h1>
              </template>
              <template x-if="block.type === 'heading' && block.props.level !== '1'">
                <h2 x-text="block.props.text" class="text-2xl font-bold"></h2>
              </template>
              <template x-if="block.type === 'paragraph'">
                <p x-text="block.props.text" class="text-slate-700"></p>
              </template>
              <template x-if="block.type === 'image'">
                <img :src="block.props.src" :alt="block.props.alt" class="max-w-full rounded-lg">
              </template>
              <template x-if="block.type === 'button'">
                <a :href="block.props.href" x-text="block.props.text"
                   class="inline-block px-5 py-2 rounded-lg font-medium"
                   :class="block.props.style === 'primary' ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-900'"></a>
              </template>
              <template x-if="block.type === 'divider'">
                <hr class="border-slate-200 my-4">
              </template>
              <template x-if="block.type === 'spacer'">
                <div :style="'height:' + (block.props.height || 40) + 'px'" class="border border-dashed border-slate-200 rounded"></div>
              </template>
            </div>
          </template>
        </div>
      </main>

      <!-- Properties panel -->
      <aside class="w-72 bg-slate-800/50 border-l border-slate-700/50 p-4 overflow-y-auto flex-shrink-0">
        <template x-if="selectedBlock">
          <div>
            <div class="text-xs uppercase tracking-wide text-slate-500 mb-3" x-text="selectedBlock.type + ' block'"></div>

            <template x-if="'text' in selectedBlock.props">
              <div class="mb-3">
                <label class="block text-xs text-slate-400 mb-1">Text</label>
                <textarea x-model="selectedBlock.props.text" rows="3" class="w-full px-2 py-1.5 rounded bg-slate-900 border border-slate-700 text-sm"></textarea>
              </div>
            </template>

            <template x-if="selectedBlock.type === 'heading'">
              <div class="mb-3">
                <label class="block text-xs text-slate-400 mb-1">Level</label>
                <select x-model="selectedBlock.props.level" class="w-full px-2 py-1.5 rounded bg-slate-900 border border-slate-700 text-sm">
                  <option value="1">H1</option>
                  <option value="2">H2</option>
                  <option value="3">H3</option>
                </select>
              </div>
            </template>

            <template x-if="selectedBlock.type === 'image'">
              <div>
                <div class="mb-3">
                  <label class="block text-xs text-slate-400 mb-1">Image URL</label>
                  <input type="text" x-model="selectedBlock.props.src" class="w-full px-2 py-1.5 rounded bg-slate-900 border border-slate-700 text-sm">
                </div>
                <div class="mb-3">
                  <label class="block text-xs text-slate-400 mb-1">Alt text</label>
                  <input type="text" x-model="selectedBlock.props.alt" class="w-full px-2 py-1.5 rounded bg-slate-900 border border-slate-700 text-sm">
                </div>
              </div>
            </template>

            <template x-if="selectedBlock.type === 'button'">
              <div>
                <div class="mb-3">
                  <label class="block text-xs text-slate-400 mb-1">Link URL</label>
                  <input type="text" x-model="selectedBlock.props.href" class="w-full px-2 py-1.5 rounded bg-slate-900 border border-slate-700 text-sm">
                </div>
                <div class="mb-3">
                  <label class="block text-xs text-slate-400 mb-1">Style</label>
                  <select x-model="selectedBlock.props.style" class="w-full px-2 py-1.5 rounded bg-slate-900 border border-slate-700 text-sm">
                    <option value="primary">Primary</option>
                    <option value="secondary">Secondary</option>
                  </select>
                </div>
              </div>
            </template>

            <template x-if="selectedBlock.type === 'spacer'">
              <div class="mb-3">
                <label class="block text-xs text-slate-400 mb-1">Height (px)</label>
                <input type="number" x-model="selectedBlock.props.height" class="w-full px-2 py-1.5 rounded bg-slate-900 border border-slate-700 text-sm">
              </div>
            </template>
          </div>
        </template>
        <template x-if="!selectedBlock">
          <div class="text-sm text-slate-500">Select a block to edit its properties.</div>
        </template>
      </aside>

    </div>
  </div>

  <script>
    function pageBuilder() {
      return {
        API: "/builder/api",
        pages: [],
        blockTypes: [],
        currentSlug: "home",
        blocks: [],
        selectedId: null,
        saveStatus: "",

        draggingId: null,
        dragOverId: null,
        dragOverPos: null,

        get selectedBlock() {
          return this.blocks.find((b) => b.id === this.selectedId) || null;
        },

        async init() {
          await this.loadBlockTypes();
          await this.loadPages();
          if (this.pages.length) {
            this.currentSlug = this.pages[0].slug;
            await this.loadPage(this.currentSlug);
          }
        },

        async api(path, options = {}) {
          const res = await fetch(this.API + path, {
            headers: { "Content-Type": "application/json" },
            ...options,
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || `Request failed (${res.status})`);
          }
          return res.json();
        },

        async loadBlockTypes() {
          const data = await this.api("/block-types");
          this.blockTypes = data.types;
        },

        async loadPages() {
          const data = await this.api("/pages");
          this.pages = data.pages;
        },

        async loadPage(slug) {
          const data = await this.api(`/pages/${slug}`);
          this.blocks = data.blocks;
          this.selectedId = null;
        },

        newPage() {
          const slug = prompt("New page slug (e.g. about):");
          if (!slug) return;
          this.currentSlug = slug;
          this.blocks = [];
          this.selectedId = null;
          if (!this.pages.find((p) => p.slug === slug)) {
            this.pages.push({ slug, title: slug });
          }
        },

        async save() {
          this.saveStatus = "Saving...";
          try {
            await this.api(`/pages/${this.currentSlug}`, {
              method: "PUT",
              body: JSON.stringify({ title: this.currentSlug, blocks: this.blocks }),
            });
            this.saveStatus = "Saved.";
            await this.loadPages();
          } catch (e) {
            this.saveStatus = "Error: " + e.message;
          }
          setTimeout(() => (this.saveStatus = ""), 2000);
        },

        makeBlock(blockType) {
          return {
            id: "b_" + Math.random().toString(36).slice(2, 10),
            type: blockType.type,
            props: { ...blockType.default_props },
          };
        },

        deleteBlock(id) {
          this.blocks = this.blocks.filter((b) => b.id !== id);
          if (this.selectedId === id) this.selectedId = null;
        },

        // --- dragging a new block in from the palette ---
        onPaletteDragStart(evt, blockType) {
          evt.dataTransfer.effectAllowed = "copy";
          evt.dataTransfer.setData("application/x-flaxon-new-block", blockType.type);
        },

        onCanvasDragOver(evt) {
          evt.dataTransfer.dropEffect = "copy";
        },

        onCanvasDragLeave(evt) {},

        onCanvasDrop(evt) {
          const newType = evt.dataTransfer.getData("application/x-flaxon-new-block");
          if (!newType) return; // a block-reorder drop already handled it via onBlockDrop
          const blockType = this.blockTypes.find((t) => t.type === newType);
          if (!blockType) return;
          this.blocks.push(this.makeBlock(blockType));
        },

        // --- dragging existing canvas blocks to reorder ---
        onBlockDragStart(evt, block) {
          evt.stopPropagation();
          this.draggingId = block.id;
          evt.dataTransfer.effectAllowed = "move";
          evt.dataTransfer.setData("application/x-flaxon-reorder", block.id);
        },

        onBlockDragEnd() {
          this.draggingId = null;
          this.dragOverId = null;
          this.dragOverPos = null;
        },

        onBlockDragOver(evt, block) {
          evt.stopPropagation();
          if (!this.draggingId || this.draggingId === block.id) return;
          const rect = evt.currentTarget.getBoundingClientRect();
          const midpoint = rect.top + rect.height / 2;
          this.dragOverId = block.id;
          this.dragOverPos = evt.clientY < midpoint ? "top" : "bottom";
        },

        onBlockDrop(evt, block) {
          evt.stopPropagation();
          const draggedId = evt.dataTransfer.getData("application/x-flaxon-reorder");
          if (!draggedId || draggedId === block.id) {
            this.onBlockDragEnd();
            return;
          }

          const fromIndex = this.blocks.findIndex((b) => b.id === draggedId);
          if (fromIndex === -1) {
            this.onBlockDragEnd();
            return;
          }
          const [moved] = this.blocks.splice(fromIndex, 1);

          let toIndex = this.blocks.findIndex((b) => b.id === block.id);
          if (this.dragOverPos === "bottom") toIndex += 1;

          this.blocks.splice(toIndex, 0, moved);
          this.onBlockDragEnd();
        },
      };
    }
  </script>
</body>
</html>
